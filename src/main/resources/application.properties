# ==========================
# Application
# ==========================
spring.application.name=nagarvaani

# Address of the React site (used in the password-reset email link)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:8443}

# Websites allowed to call this API (comma separated)
app.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8443}

server.port=${PORT:8080}

# ==========================
# Database  (values come from environment variables - never write real ones here)
# ==========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# ==========================
# Security
# ==========================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==========================
# Image uploads (Cloudinary)
# ==========================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==========================
# Email
#  - BREVO_API_KEY set  -> emails are sent through Brevo's HTTPS API (use this when deployed)
#  - BREVO_API_KEY empty -> normal SMTP below (for example Gmail on your laptop)
# ==========================
app.brevo.api-key=${BREVO_API_KEY:}
app.mail-from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail-from-name=CivicConnect

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000